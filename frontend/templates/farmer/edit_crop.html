<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Crop | DirectHarvest AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

{% include 'components/sidebar.html' %}

<div class="main-content">

    <div class="container">

        <div class="card shadow mt-4">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">
                    ✏️ Edit Crop
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Crop Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="crop_name"
                            value="{{ crop.crop_name }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Quantity Available (KG)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="quantity"
                            value="{{ crop.quantity_available }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Price Per KG (₹)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="farmer_price"
                            value="{{ crop.farmer_price }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            rows="5"
                            name="description">{{ crop.description }}</textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Update Crop

                            </button>

                        </div>

                        <div class="col-md-6">

                            <a href="/farmer/manage-crops"
                               class="btn btn-secondary w-100">

                                Cancel

                            </a>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
